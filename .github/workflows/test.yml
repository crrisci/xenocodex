name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Keep internal documents out of public source
        run: |
          python3 - <<'PYCODE'
          import subprocess
          forbidden = subprocess.check_output(['git', 'ls-files', '--', 'docs/', 'native/', '.test-artifacts/'], text=True)
          if forbidden:
              raise SystemExit('Private paths must not be tracked: ' + forbidden)
          PYCODE
      - run: npm test
      - run: npm install --prefix "$RUNNER_TEMP/chat-sdk" --ignore-scripts openai@7.32.0
      - name: Chat SDK integration
        run: npm run test:chat
        env:
          XENOLITH_BRIDGE_OPENAI_SDK: ${{ runner.temp }}/chat-sdk/node_modules/openai/index.mjs
      - uses: actions/setup-python@v5
        if: matrix.node == 22
        with:
          python-version: '3.12'
      - name: Install isolated Aider test client
        if: matrix.node == 22
        run: |
          python -m venv "$RUNNER_TEMP/aider-runtime"
          "$RUNNER_TEMP/aider-runtime/bin/python" -m pip install --disable-pip-version-check aider-chat==0.86.2
      - name: Aider coding integration
        if: matrix.node == 22
        run: npm run test:aider
        env:
          XENOLITH_BRIDGE_AIDER_PYTHON: ${{ runner.temp }}/aider-runtime/bin/python
      - run: npm install --prefix "$RUNNER_TEMP/codex-cli" @openai/codex@0.162.1
      - name: Codex integration
        run: |
          ulimit -c 0
          npm run test:codex 2>&1 | tee .test-artifacts/codex-ci.log
        env:
          XENOLITH_BRIDGE_CODEX_BIN: ${{ runner.temp }}/codex-cli/node_modules/.bin/codex
      - name: Report integration failure
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('.test-artifacts/codex-ci.log')
          if p.exists():
              text = p.read_text()[-24000:]
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Codex integration details::' + text)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: codex-failure-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            .test-artifacts/codex-ci.log
            .test-artifacts/**/*.stderr.log
            .test-artifacts/**/*.stdout.jsonl
            .test-artifacts/**/requests.json
            .test-artifacts/**/wire.json
            .test-artifacts/**/before-restart.json
            .test-artifacts/**/final.json
          include-hidden-files: true
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          ARCHIVE="xenolith-bridge-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="xenolith-bridge-$VERSION/" --output="$ARCHIVE" "$GITHUB_REF_NAME"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --verify-tag --prerelease --title "Xenolith Bridge $VERSION" --notes-file .github/RELEASE-NOTES.md
      - name: Remove superseded oversized diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ID in 11776204251 11776059484; do
            if INFO=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" 2>/dev/null); then
              echo "$INFO" | jq -e '.workflow_run.head_sha == "2c6b3ce9b7514cb9581b5fb8de0a348b12c1c32c" and (.name | startswith("codex-failure-")) and .size_in_bytes > 67108864'
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID"
            fi
          done
