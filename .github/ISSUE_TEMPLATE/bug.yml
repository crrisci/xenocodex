name: Bug report
description: Report a reproducible Bridge problem without sharing private logs.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Run `xenolith-bridge doctor --socket /your/socket --report doctor-summary.json` for a shareable diagnostic summary.
        For a real acceptance run, share only `release-summary.json`, not the raw `release-result.json` or logs.
        Reports contain a fixed set of diagnostic fields; review them before sharing. Do not post prompts, tool results, tokens, model names or local paths.
        Simulator results and `doctor` checks do not establish real-model compatibility.
  - type: input
    id: version
    attributes:
      label: Bridge version
      description: Output of xenolith-bridge --version.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: OpenAI SDK, Codex, Aider, or another HTTP client
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction and expected/actual behavior
      description: Include a minimal request with invented input. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Optional doctor or acceptance summary
      description: Paste only the field-limited summary generated by Bridge.
      render: json
  - type: dropdown
    id: evidence
    attributes:
      label: Where was the failure observed?
      options:
        - Real engine
        - Wire simulator
        - Before connecting to an engine
        - Unknown
    validations:
      required: true
